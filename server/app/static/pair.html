<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable" data-dataviz="on">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Leuffen RMM — Link LeuffenDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .pair { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .pair .card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--border);
                  border-radius: var(--r-xl); box-shadow: var(--shadow-lg); padding: 30px; }
    .pair .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .pair .brand .logo { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: var(--r-md);
                         background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); color: #fff; }
    .pair h1 { font-size: 17px; margin: 0 0 6px; }
    .pair .target { font-family: "JetBrains Mono", monospace; font-size: 14px; padding: 10px 12px; border-radius: var(--r-md);
                    background: var(--surface-2); border: 1px solid var(--border); margin: 12px 0 16px; word-break: break-all; }
    .pair ul { margin: 0 0 16px; padding-left: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
    .pair .note { font-size: 12.5px; color: var(--text-faint); line-height: 1.6; margin-bottom: 18px; }
    .pair .row { display: flex; gap: 10px; }
    .pair .row .btn { flex: 1; justify-content: center; padding: 10px; }
    .pair .err { color: var(--bad); font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="pair"><div class="card">
    <div class="brand"><span class="logo" id="logo"></span> Leuffen <span style="color:var(--text-dim)">RMM</span></div>
    <div id="body"><div class="muted">Loading…</div></div>
  </div></div>
  <script src="/icons.js"></script>
  <script src="/pair.js"></script>
</body>
</html>
